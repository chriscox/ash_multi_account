name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  ELIXIR_EXS_LOG_LEVEL: warning

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17"
            otp: "26"
          - elixir: "1.17"
            otp: "27"
          - elixir: "1.18"
            otp: "26"
          - elixir: "1.18"
            otp: "27"
          - elixir: "1.19"
            otp: "27"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Run tests
        run: mix test

  demo:
    name: Demo app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore demo dependencies cache
        uses: actions/cache@v4
        with:
          path: example/demo/deps
          key: ${{ runner.os }}-demo-mix-${{ hashFiles('example/demo/mix.lock') }}
          restore-keys: ${{ runner.os }}-demo-mix-

      - name: Install demo dependencies
        working-directory: example/demo
        run: mix deps.get

      - name: Compile demo (warnings as errors)
        working-directory: example/demo
        run: mix compile --warnings-as-errors

      - name: Check demo formatting
        working-directory: example/demo
        run: mix format --check-formatted

      - name: Run demo tests
        working-directory: example/demo
        run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19"
          otp-version: "27"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-1.19-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-1.19-27-

      - name: Restore PLT cache
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-1.19-27-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-1.19-27-

      - name: Install dependencies
        run: mix deps.get

      - name: Build PLT
        run: mkdir -p priv/plts && mix dialyzer --plt

      - name: Run Dialyzer
        run: mix dialyzer
